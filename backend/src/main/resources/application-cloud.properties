# Profile cloud (Cloud Run): SPRING_PROFILES_ACTIVE=cloud.

# Log JSON một dòng; Cloud Logging tách thành jsonPayload.*.
logging.structured.format.console=vn.edu.uth.bookstore.logging.CloudLoggingFormatter

# JWT của Firebase Authentication / Identity Platform. Spring kiểm tra chữ ký (khóa công khai của Google), iss, aud, exp.
# AUTH_PROJECT_ID: project ID của Firebase / Identity Platform.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${AUTH_PROJECT_ID}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH_PROJECT_ID}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com

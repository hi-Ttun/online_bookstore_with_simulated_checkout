# Profile local: môi trường phát triển dùng docker-compose.yml. Thông tin đăng nhập ở đây chỉ dùng cục bộ.

# Cổng 5433 để không trùng với PostgreSQL có thể đã cài sẵn trên máy (5432).
spring.datasource.url=jdbc:postgresql://localhost:5433/bookstore
spring.datasource.username=bookstore
spring.datasource.password=bookstore

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Khóa ký token phát triển (POST /dev/token). user=operator ứng với operator@demo.local.
app.auth.dev-secret=local-dev-secret-NOT-for-cloud-0123456789abcdef
app.auth.operator-emails=operator@demo.local

app.pubsub.project-id=local-project
app.pubsub.emulator-host=localhost:8085

# Ở local, API, relay, worker và reconciler chạy trong cùng một tiến trình.
# Emulator đẩy message tới http://host.docker.internal:8080/internal/pubsub/push.
app.relay.enabled=${APP_RELAY_ENABLED:true}
app.worker.enabled=${APP_WORKER_ENABLED:true}
app.reconciler.enabled=${APP_RECONCILER_ENABLED:true}
app.reconciler.interval-ms=${APP_RECONCILER_INTERVAL_MS:5000}
app.outbox-stats.interval-ms=${APP_OUTBOX_STATS_INTERVAL_MS:10000}

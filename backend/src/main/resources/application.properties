spring.application.name=bookstore

# Cấu hình dùng chung. Các giá trị kết nối không có mặc định: thiếu biến môi trường thì ứng dụng dừng ngay khi khởi động.
# Không đặt SPRING_PROFILES_ACTIVE: dùng profile local (application-local.properties, trỏ tới docker-compose).
# Cloud Run: SPRING_PROFILES_ACTIVE=cloud; DB_PASSWORD lấy từ Secret Manager.
spring.profiles.default=local

server.port=${PORT:8080}

# Log dạng văn bản có tiền tố [correlationId]; nhóm %( ) của logback giữ lại khoảng trắng cuối.
logging.pattern.correlation=%([%X{correlationId:-}] )

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Cloud SQL cấu hình nhỏ giới hạn số kết nối; mỗi instance giữ tối đa 5.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.flyway.enabled=true

# Origin của Frontend được phép gọi API (phân tách bằng dấu phẩy).
app.cors.allowed-origins=${APP_CORS_ORIGINS}

# Email của Store Operator (phân tách bằng dấu phẩy); tài khoản phải có email_verified = true.
app.auth.operator-emails=${APP_OPERATOR_EMAILS}

# Pub/Sub. emulator-host để trống: dùng Pub/Sub thật với service account của Cloud Run.
app.pubsub.project-id=${GCP_PROJECT_ID}
app.pubsub.topic=${PUBSUB_TOPIC:order-events}
app.pubsub.emulator-host=

# Outbox relay: chỉ bật trên service relay.
app.relay.enabled=${APP_RELAY_ENABLED:false}
app.relay.interval-ms=${APP_RELAY_INTERVAL_MS:1000}
app.relay.batch-size=100

# Log định kỳ event=outbox_stats, nguồn cho metric outbox age; độc lập với relay.
app.outbox-stats.enabled=${APP_OUTBOX_STATS_ENABLED:true}
app.outbox-stats.interval-ms=${APP_OUTBOX_STATS_INTERVAL_MS:30000}

# Worker: đăng ký endpoint POST /internal/pubsub/push; chỉ bật trên service worker (Require authentication).
app.worker.enabled=${APP_WORKER_ENABLED:false}

# Đối soát định kỳ các lần thanh toán UNKNOWN đã chờ ít nhất min-age-seconds.
app.reconciler.enabled=${APP_RECONCILER_ENABLED:false}
app.reconciler.interval-ms=${APP_RECONCILER_INTERVAL_MS:30000}
app.reconciler.min-age-seconds=${APP_RECONCILER_MIN_AGE_SECONDS:10}

# Ba tác vụ định kỳ (relay, outbox stats, reconciler) chạy song song.
spring.task.scheduling.pool.size=3

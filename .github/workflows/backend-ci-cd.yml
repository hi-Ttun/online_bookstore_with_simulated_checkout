name: Backend CI/CD

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci-cd.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci-cd.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # cho Workload Identity Federation

env:
  REGION: asia-southeast1

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Chạy 13 test (Testcontainers dùng Docker có sẵn trên runner)
        run: |
          sed -i 's/\r$//' mvnw && chmod +x mvnw
          ./mvnw -B test

  deploy:
    needs: test
    # PR chỉ test. Deploy chỉ chạy khi đã cấu hình biến WIF_PROVIDER (tức là đã có project GCP).
    if: github.event_name != 'pull_request' && vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push 1 image (tag = git SHA để rollback được)
        run: |
          IMAGE="${{ vars.REGISTRY }}/bookstore-backend:${GITHUB_SHA}"
          gcloud auth configure-docker ${REGION}-docker.pkg.dev -q
          docker build -t "$IMAGE" backend/
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy 3 service (chỉ đổi image; env/VPC/SA do Terraform quản lý)
        run: |
          for svc in bookstore-api bookstore-worker bookstore-relay; do
            gcloud run deploy "$svc" --image "$IMAGE" --region "$REGION" --quiet
          done

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe bookstore-api --region "$REGION" --format='value(status.url)')
          curl -fsS "$URL/healthz"
          echo
          # /dev/token chỉ có ở profile local -> trên cloud phải 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/dev/token")" = "404"
          # Gọi API cần đăng nhập mà không có token -> 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/orders")" = "401"
